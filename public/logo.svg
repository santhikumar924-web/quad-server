<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="quad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242D57"/>
      <stop offset="100%" stop-color="#141933"/>
    </linearGradient>
    <linearGradient id="quad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD278"/>
      <stop offset="60%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#C7821B"/>
    </linearGradient>
    <linearGradient id="quad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 210, 120, 0.5)"/>
      <stop offset="100%" stop-color="rgba(232, 163, 61, 0.1)"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container badge -->
  <rect x="1" y="1" width="42" height="42" rx="12" fill="url(#quad-bg)" stroke="url(#quad-border)" stroke-width="1.2"/>

  <!-- Outer Chat Bubble / Letter Q shape -->
  <path d="M 21 8.5 C 27.9 8.5 33.5 14.1 33.5 21 C 33.5 24.1 32.35 26.95 30.45 29.15 L 33.5 34 L 28 32.3 C 25.95 33.05 23.55 33.5 21 33.5 C 14.1 33.5 8.5 27.9 8.5 21 C 8.5 14.1 14.1 8.5 21 8.5 Z" 
        stroke="url(#quad-gold)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="rgba(232, 163, 61, 0.06)"/>

  <!-- Connecting Quad Constellation Grid -->
  <line x1="16.5" y1="16.5" x2="25.5" y2="16.5" stroke="rgba(232, 163, 61, 0.35)" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <line x1="16.5" y1="24.5" x2="25.5" y2="24.5" stroke="rgba(232, 163, 61, 0.35)" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <line x1="16.5" y1="16.5" x2="16.5" y2="24.5" stroke="rgba(232, 163, 61, 0.35)" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <line x1="25.5" y1="16.5" x2="25.5" y2="24.5" stroke="rgba(232, 163, 61, 0.35)" stroke-width="1.2" stroke-dasharray="2 1.5"/>

  <!-- 4 Connected Nodes -->
  <circle cx="16.5" cy="16.5" r="2.3" fill="url(#quad-gold)" filter="url(#gold-glow)"/>
  <circle cx="25.5" cy="16.5" r="2.3" fill="url(#quad-gold)" filter="url(#gold-glow)"/>
  <circle cx="16.5" cy="24.5" r="2.3" fill="url(#quad-gold)" filter="url(#gold-glow)"/>
  <circle cx="25.5" cy="24.5" r="2.3" fill="url(#quad-gold)" filter="url(#gold-glow)"/>
</svg>
